[package]
name = "scribium-upstream-watch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Upstream release drift detector for Scribium Quarkdown compatibility"
repository = "https://github.com/luceat-lux-vestra/scribium"
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "scribium-upstream-watch"
path = "src/main.rs"