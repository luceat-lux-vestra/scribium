[workspace]
resolver = "2"
members = [
    "crates/scribium-core",
    "crates/scribium-typst",
    "crates/scribium-cli",
    "crates/scribium-test-support",
    "tools/upstream-watch",
]

exclude = [
    "tools/spikes/typst-in-process",
    "tools/spikes/typst-subprocess",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
license-file = "LICENSE"
homepage = "https://github.com/luceat-lux-vestra/scribium"
repository = "https://github.com/luceat-lux-vestra/scribium"
authors = ["Scribium Authors"]

[workspace.dependencies]
scribium-core = { path = "crates/scribium-core" }
scribium-typst = { path = "crates/scribium-typst" }
scribium-cli = { path = "crates/scribium-cli" }
scribium-test-support = { path = "crates/scribium-test-support" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
same-file = "1.0.6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = "1"
tempfile = "3"

[profile.release]
opt-level = 2
debug = 1
strip = "symbols"